spring.application.name=diplomatic-fleet

# Conexion con PostgreSQL mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate valida el esquema, pero no crea ni modifica tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway administra las migraciones de la base de datos
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuracion general del servidor
server.port=8080